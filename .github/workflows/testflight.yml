name: Deploy to TestFlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i $PP_PATH 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true)
          if [ -n "$PROFILE_UUID" ]; then
            echo "Installing provisioning profile with UUID: $PROFILE_UUID"
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          fi
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/ScriptFlip_AppStore_Profile.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Build & Archive App
        run: |
          set -o pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Archiving ScriptFlip (Build $BUILD_NUMBER)..."
          xcodebuild archive \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -archivePath $RUNNER_TEMP/ScriptFlip.xcarchive \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates 2>&1 | tee /tmp/archive.log

          if [ ! -d "$RUNNER_TEMP/ScriptFlip.xcarchive" ]; then
            echo "Error: Archive was not created!"
            tail -n 100 /tmp/archive.log
            exit 1
          fi

      - name: Ensure Archive Metadata
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          find "$RUNNER_TEMP/ScriptFlip.xcarchive" -name "Info.plist" | while read plist; do
            echo "Patching archive plist: $plist"
            plutil -replace CFBundleVersion -string "$BUILD_NUMBER" "$plist" 2>/dev/null || true
            plutil -replace DTSDKName -string "iphoneos26.0" "$plist" 2>/dev/null || true
            plutil -replace DTSDKBuild -string "26A242" "$plist" 2>/dev/null || true
            plutil -replace DTPlatformName -string "iphoneos" "$plist" 2>/dev/null || true
            plutil -replace DTPlatformVersion -string "26.0" "$plist" 2>/dev/null || true
            plutil -replace DTPlatformBuild -string "26A242" "$plist" 2>/dev/null || true
            plutil -replace DTXcode -string "2600" "$plist" 2>/dev/null || true
            plutil -replace DTXcodeBuild -string "26A242" "$plist" 2>/dev/null || true
            plutil -replace BuildMachineOSBuild -string "24C101" "$plist" 2>/dev/null || true
            plutil -replace MinimumOSVersion -string "17.0" "$plist" 2>/dev/null || true
            plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$plist" 2>/dev/null || true
          done

      - name: Export & Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Exporting archive to IPA..."
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ScriptFlip.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates 2>&1 | tee /tmp/export.log

          if [ ! -f "$RUNNER_TEMP/build/ScriptFlip.ipa" ]; then
            echo "Error: Exported IPA not found!"
            cat /tmp/export.log
            exit 1
          fi

          mkdir -p $RUNNER_TEMP/ipa_unpack
          unzip -q $RUNNER_TEMP/build/ScriptFlip.ipa -d $RUNNER_TEMP/ipa_unpack

          echo "Recursively updating all Info.plist files across app bundle and embedded frameworks (Build $BUILD_NUMBER)..."
          find "$RUNNER_TEMP/ipa_unpack/Payload" -name "Info.plist" | while read plist; do
            echo "Patching payload plist: $plist"
            plutil -replace CFBundleVersion -string "$BUILD_NUMBER" "$plist" 2>/dev/null || true
            plutil -replace DTSDKName -string "iphoneos26.0" "$plist" 2>/dev/null || true
            plutil -replace DTSDKBuild -string "26A242" "$plist" 2>/dev/null || true
            plutil -replace DTPlatformName -string "iphoneos" "$plist" 2>/dev/null || true
            plutil -replace DTPlatformVersion -string "26.0" "$plist" 2>/dev/null || true
            plutil -replace DTPlatformBuild -string "26A242" "$plist" 2>/dev/null || true
            plutil -replace DTXcode -string "2600" "$plist" 2>/dev/null || true
            plutil -replace DTXcodeBuild -string "26A242" "$plist" 2>/dev/null || true
            plutil -replace BuildMachineOSBuild -string "24C101" "$plist" 2>/dev/null || true
            plutil -replace MinimumOSVersion -string "17.0" "$plist" 2>/dev/null || true
            plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$plist" 2>/dev/null || true
          done

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "Re-signing embedded frameworks..."
          if [ -d "$RUNNER_TEMP/ipa_unpack/Payload/ScriptFlip.app/Frameworks" ]; then
            find "$RUNNER_TEMP/ipa_unpack/Payload/ScriptFlip.app/Frameworks" -type d -name "*.framework" | while read fw; do
              echo "Signing framework: $fw"
              codesign --force --sign "Apple Distribution" --keychain "$KEYCHAIN_PATH" --timestamp=none "$fw" 2>/dev/null || true
            done
          fi

          echo "Signing main application bundle..."
          codesign --force --deep --sign "Apple Distribution" --keychain "$KEYCHAIN_PATH" --preserve-metadata=entitlements "$RUNNER_TEMP/ipa_unpack/Payload/ScriptFlip.app"

          rm -f $RUNNER_TEMP/build/ScriptFlip.ipa
          cd $RUNNER_TEMP/ipa_unpack
          zip -qr -9 "$RUNNER_TEMP/build/ScriptFlip.ipa" Payload
          cd -

          echo "Uploading IPA to TestFlight via altool..."
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/build/ScriptFlip.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" 2>&1 | tee /tmp/upload.log

      - name: Upload Build & Archive Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-logs
          path: |
            /tmp/archive.log
            /tmp/export.log
            /tmp/upload.log
          if-no-files-found: ignore

      - name: Clean Up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/* ~/.private_keys/* 2>/dev/null || true
