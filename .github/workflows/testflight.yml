name: Deploy to TestFlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload to TestFlight (macOS 26 & Xcode 26 GM)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select & Verify Clean Public GM Xcode Environment
        run: |
          BEST_XCODE=""
          echo "Scanning all installed Xcode versions for official Public GM releases..."
          for xc in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            DEV_PATH="$xc/Contents/Developer"
            X_VER=$("$DEV_PATH/usr/bin/xcodebuild" -version 2>/dev/null | head -n 1)
            SDK_BLD=$("$DEV_PATH/usr/bin/xcrun" --sdk iphoneos --show-sdk-build-version 2>/dev/null)
            echo "Inspecting $xc -> $X_VER (SDK Build: $SDK_BLD)"
            if [[ -n "$SDK_BLD" ]] && ! echo "$X_VER" | grep -qiE "beta|rc|seed" && ! echo "$SDK_BLD" | grep -qE "[a-z]$"; then
              BEST_XCODE="$DEV_PATH"
              echo ">>> Selected Public GM Release: $xc ($X_VER, SDK Build: $SDK_BLD)"
              break
            fi
          done

          if [ -n "$BEST_XCODE" ]; then
            sudo xcode-select -s "$BEST_XCODE"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          XCODE_INFO=$(xcodebuild -version)
          SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          echo "========================================="
          echo "Active Xcode: $XCODE_INFO"
          echo "Active iOS SDK Build: $SDK_BUILD"
          echo "Developer Path: $(xcode-select -p)"
          echo "========================================="
          if echo "$XCODE_INFO" | grep -qiE "beta|rc|seed"; then
            echo "❌ ERROR: Beta or pre-release Xcode detected. Only official public GM releases are permitted."
            exit 1
          fi
          if echo "$SDK_BUILD" | grep -qE "[a-z]$"; then
            echo "❌ ERROR: iOS SDK build ($SDK_BUILD) is a beta seed. Only public GM builds are permitted."
            exit 1
          fi
          echo "✅ Public GM Xcode and iOS SDK verified."

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i $PP_PATH 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true)
          if [ -n "$PROFILE_UUID" ]; then
            echo "Installing provisioning profile with UUID: $PROFILE_UUID"
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          fi
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/ScriptFlip_AppStore_Profile.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Build & Archive App
        run: |
          set -o pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Archiving ScriptFlip (Build $BUILD_NUMBER)..."
          xcodebuild archive \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -archivePath $RUNNER_TEMP/ScriptFlip.xcarchive \
            -destination "generic/platform=iOS" \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates 2>&1 | tee /tmp/archive.log

          if [ ! -d "$RUNNER_TEMP/ScriptFlip.xcarchive" ]; then
            echo "Error: Archive was not created!"
            tail -n 100 /tmp/archive.log
            exit 1
          fi

      - name: Export & Upload to TestFlight (Native Apple Xcode Pipeline)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Exporting archive and uploading directly to TestFlight / App Store Connect (Build $BUILD_NUMBER)..."
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ScriptFlip.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee /tmp/export.log

      - name: Upload Build & Archive Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-logs
          path: |
            /tmp/archive.log
            /tmp/export.log
            /tmp/upload.log
          if-no-files-found: ignore

      - name: Clean Up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/* ~/.private_keys/* 2>/dev/null || true
