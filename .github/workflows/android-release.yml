name: Android Automated Release (Google Play)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Marketing Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version Code Override (leave blank for auto-increment)'
        required: false
        default: ''
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

permissions:
  contents: read
  id-token: write # Required for Keyless Workload Identity Federation

jobs:
  release:
    name: Build, Sign & Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version Code & Name
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            RESOLVED_CODE="${{ github.event.inputs.version_code }}"
          else
            RESOLVED_CODE=$(( ${{ github.run_number }} + 100 ))
          fi

          RESOLVED_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"

          echo "VERSION_CODE=$RESOLVED_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$RESOLVED_NAME" >> $GITHUB_ENV
          echo "Resolved version: Code=$RESOLVED_CODE, Name=$RESOLVED_NAME"

      - name: Decode Upload Keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x gradlew || true

      - name: Build Signed Release App Bundle (AAB)
        working-directory: ./android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Authenticate to Google Cloud (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.qlueconsulting.scriptflip
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_CODE }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
