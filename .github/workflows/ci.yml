name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS 26 & Xcode 26 GM)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select & Verify Clean Public GM Xcode Environment
        run: |
          BEST_XCODE=""
          echo "Scanning all installed Xcode versions for target build 17F113 or verified Public GM release..."
          for xc in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            DEV_PATH="$xc/Contents/Developer"
            X_BUILD=$("$DEV_PATH/usr/bin/xcodebuild" -version 2>/dev/null | grep -i "Build version" | awk '{print $3}')
            X_VER=$("$DEV_PATH/usr/bin/xcodebuild" -version 2>/dev/null | head -n 1)
            SDK_BLD=$("$DEV_PATH/usr/bin/xcrun" --sdk iphoneos --show-sdk-build-version 2>/dev/null)
            echo "Inspecting $xc -> $X_VER (Build: $X_BUILD, SDK Build: $SDK_BLD)"
            if [ "$X_BUILD" = "17F113" ]; then
              BEST_XCODE="$DEV_PATH"
              echo ">>> Explicitly selected target Xcode build 17F113: $xc"
              break
            fi
            if [[ -z "$BEST_XCODE" ]] && [[ -n "$SDK_BLD" ]] && ! echo "$X_VER" | grep -qiE "beta|rc|seed" && ! echo "$SDK_BLD" | grep -qE "[a-z]$"; then
              BEST_XCODE="$DEV_PATH"
            fi
          done

          if [ -n "$BEST_XCODE" ]; then
            sudo xcode-select -s "$BEST_XCODE"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          XCODE_INFO=$(xcodebuild -version)
          SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          echo "========================================="
          echo "Active Xcode: $XCODE_INFO"
          echo "Active iOS SDK Build: $SDK_BUILD"
          echo "Developer Path: $(xcode-select -p)"
          echo "========================================="
          if echo "$XCODE_INFO" | grep -qiE "beta|rc|seed"; then
            echo "❌ ERROR: Beta or pre-release Xcode detected. Only official public GM releases are permitted."
            exit 1
          fi
          if echo "$SDK_BUILD" | grep -qE "[a-z]$"; then
            echo "❌ ERROR: iOS SDK build ($SDK_BUILD) is a beta seed. Only public GM builds are permitted."
            exit 1
          fi
          echo "✅ Public GM Xcode and iOS SDK verified."

      - name: Run Unit Tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          echo "Selected Concrete Simulator Device UUID: $DEVICE_ID"
          if [ -n "$DEVICE_ID" ]; then
            DEST="platform=iOS Simulator,id=$DEVICE_ID"
          else
            DEST="generic/platform=iOS"
          fi
          echo "Running tests on destination: $DEST"
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "$DEST" \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log

      - name: Validate Release Build Compilation (iOS Device Target)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/release_build.log

      - name: Upload Test and Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ci-logs
          path: |
            /tmp/test.log
            /tmp/release_build.log
          if-no-files-found: ignore
