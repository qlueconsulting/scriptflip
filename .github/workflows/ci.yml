name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS 15 & Xcode 16)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run Unit Tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log

      - name: Validate Release Build Compilation (iOS Device Target)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/release_build.log

      - name: Upload Test and Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ci-logs
          path: |
            /tmp/test.log
            /tmp/release_build.log
          if-no-files-found: ignore
