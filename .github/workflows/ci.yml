name: Build and Test
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Swift / Xcode
        run: |
          swift --version
          xcodebuild -version
      - name: Resolve SPM Dependencies
        run: swift package resolve
      - name: Run Swift Tests
        run: swift test
