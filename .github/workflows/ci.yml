name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build & Test via xcodebuild (iOS Simulator)
        run: |
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO > /tmp/test.log 2>&1 || true

          echo "## Xcodebuild Test Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 /tmp/test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          cat /tmp/test.log | tail -n 60

          if grep -q "\*\* TEST SUCCEEDED \*\*" /tmp/test.log; then
            echo "Tests passed successfully!"
            exit 0
          else
            echo "Tests failed."
            exit 1
          fi

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-logs
          path: /tmp/test.log
          if-no-files-found: ignore
