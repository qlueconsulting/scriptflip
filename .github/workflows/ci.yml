name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build & Test via xcodebuild (iOS Simulator)
        run: |
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log || \
          xcodebuild build \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a /tmp/test.log

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-logs
          path: /tmp/test.log
          if-no-files-found: ignore
