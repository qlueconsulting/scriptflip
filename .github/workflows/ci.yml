name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version

      - name: Build & Test via xcodebuild (iOS Simulator)
        run: |
          xcodebuild build-for-testing \
            -scheme ScriptFlip \
            -destination 'generic/platform=iOS Simulator' \
            -quiet || swift test
