name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS 26 & Xcode 26 GM)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 GM (iOS 26 SDK)
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          XCODE_VER=$(xcodebuild -version | head -n 1)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Active Xcode Version: $XCODE_VER"
          echo "Active iOS SDK Version: $SDK_VER"

      - name: Run Unit Tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | awk -F '[()]' '{print $(NF-1)}')
          echo "Selected Concrete Simulator Device UUID: $DEVICE_ID"
          if [ -n "$DEVICE_ID" ]; then
            DEST="platform=iOS Simulator,id=$DEVICE_ID"
          else
            DEST="generic/platform=iOS"
          fi
          echo "Running tests on destination: $DEST"
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "$DEST" \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log

      - name: Validate Release Build Compilation (iOS Device Target)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/release_build.log

      - name: Upload Test and Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ci-logs
          path: |
            /tmp/test.log
            /tmp/release_build.log
          if-no-files-found: ignore
