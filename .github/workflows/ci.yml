name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS 15 & Xcode 16)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version (Strict GM Only)
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          XCODE_VER=$(xcodebuild -version | head -n 1)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Selected Xcode: $XCODE_VER"
          echo "Selected SDK: $SDK_VER"
          if echo "$XCODE_VER" | grep -qi "beta"; then
            echo "Error: Detected beta version of Xcode in CI pipeline ($XCODE_VER). Only public GM releases are permitted."
            exit 1
          fi

      - name: Run Unit Tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log

      - name: Validate Release Build Compilation (iOS Device Target)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/release_build.log

      - name: Upload Test and Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ci-logs
          path: |
            /tmp/test.log
            /tmp/release_build.log
          if-no-files-found: ignore
