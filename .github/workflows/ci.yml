name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS 15 & Xcode GA)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Official GA Xcode Environment on macOS 15
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          XCODE_INFO=$(xcodebuild -version)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          echo "========================================="
          echo "Active Xcode: $XCODE_INFO"
          echo "Active iOS SDK Version: $SDK_VER"
          echo "Active iOS SDK Build: $SDK_BUILD"
          echo "Host macOS Version: $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "Developer Path: $(xcode-select -p)"
          echo "========================================="
          if echo "$XCODE_INFO" | grep -qiE "beta|rc|seed"; then
            echo "❌ ERROR: Beta or pre-release Xcode detected."
            exit 1
          fi
          echo "✅ Production GA Xcode on macOS 15 verified."

      - name: Run Unit Tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          echo "Selected Concrete Simulator Device UUID: $DEVICE_ID"
          if [ -n "$DEVICE_ID" ]; then
            DEST="platform=iOS Simulator,id=$DEVICE_ID"
          else
            DEST="generic/platform=iOS"
          fi
          echo "Running tests on destination: $DEST"
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "$DEST" \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log

      - name: Validate Release Build Compilation (iOS Device Target)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/release_build.log

      - name: Upload Test and Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-ci-logs
          path: |
            /tmp/test.log
            /tmp/release_build.log
          if-no-files-found: ignore
