name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build and Test via xcodebuild (iOS Simulator)
        run: |
          xcodebuild test \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage NO \
            -quiet || \
          xcodebuild build \
            -project ScriptFlip.xcodeproj \
            -scheme ScriptFlip \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -quiet
